name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q

  test-no-rdkit:
    # The [test] extra bundles rdkit, so the "rdkit is not installed" code path
    # (guarded in tests via pytest.importorskip("rdkit")) never otherwise runs
    # in CI. Install without rdkit and confirm the suite still passes, with the
    # rdkit-dependent tests skipped rather than erroring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . "pytest>=7"
      - run: python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('rdkit') is None else 1)"
      - run: pytest -q -rs
