name: Publish to PyPI
# Tag a release (git tag v0.1.0 && git push --tags) to build, test, and publish.
# Uses PyPI Trusted Publishing (OIDC) — configure a trusted publisher for this
# repo at https://pypi.org/manage/project/scigantic-wwpdb/settings/publishing/
# (workflow: publish.yml, environment: pypi). No token secret required.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[test]" build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
